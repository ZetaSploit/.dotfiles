[manager]
show_hidden = true
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"

[preview]
max_width = 1000
max_height = 1000

[opener]
edit = [
    { run = 'nvim "$@"', block = true }
]

[open]
prepend_rules = [
    { name = "*.json", use = "edit" },
    { name = "*.md", use = "edit" },
    { name = "*.py", use = "edit" },
    { name = "*.cpp", use = "edit" },
    { name = "*.c", use = "edit" },
]
